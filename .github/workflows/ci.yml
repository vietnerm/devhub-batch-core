Thought Process

OK, rõ rồi — mình sẽ review trực tiếp trong chat, không tạo file. Để review chính xác, mình đọc kỹ toàn bộ source code trước đã.

Đã đọc xong toàn bộ source (43 file Java ~4.900 dòng, 4 migration SQL, 59 docs, cấu hình build). Dưới đây là review chi tiết.
Review: devhub-rbac-batch
1. Bức tranh tổng thể

Đây là scheduler + batch worker standalone bằng Java 21, thuần JDBC (không Spring runtime), chạy tách rời web project devhub-rbac-web, giao tiếp qua MySQL (SYS_SCHEDULED_TASKS, SYS_TASK_EXECUTION_LOGS, SYS_SCHEDULER_WORKERS). Điểm đặc biệt nhất: phần zz/ không phải batch nghiệp vụ thông thường mà là "governed AI coding worker" — agent AI (AgentScope + Ollama Cloud) nhận ticket IT đã duyệt, tự clone repo, phân tích root cause, sửa code, chạy verification, push branch và mở PR lên Gitea để người review chốt. Có thể nói đây là một pipeline "AI dev-ops" thật sự, không phải demo.
2. Điểm mạnh

2.1. Kiến trúc core sạch, đúng pattern

    Scheduled / Task / Runner / JdbcTaskRepository chỉ phụ thuộc javax.sql.DataSource — không import Spring ở đâu cả. SchedulerBootstrap có sẵn contract để nhúng vào Spring web sau này (inject DataSource là chạy). Đây là nền tảng tốt để build giao diện web điều khiển vì web project chỉ cần ghi DB là scheduler tự pickup trong 5 giây (reconcile — xem Scheduled.reconcileDatabaseControls()).
    Tách lớp đúng: core (scheduler), go (batch nghiệp vụ GO), zz (batch nội bộ/AI), standalone (CLI + config).

2.2. Distributed-ready nghiêm túc

    Claim atomic qua 1 câu UPDATE có điều kiện (claimTask trong JdbcTaskRepository.java:123) — nhiều worker cùng fire cũng chỉ 1 thắng, kèm rule "cùng TASK_NAME không chạy song song".
    Heartbeat 5s + bảng SYS_SCHEDULER_WORKERS đầy đủ metadata (machine, IP, MAC, OS, Java, PID, container) — nền tảng tốt cho trang dashboard "ai đang chạy cái gì".
    Startup cleanup: task RUNNING sót lại của worker chết được đánh TIMEOUT.

2.3. Schedule contract chặt

    ScheduleValidator chuẩn hóa ONCE/RECURRING, chặn cron lẫn one-time, và có chi tiết hiếm thấy: đọc cả description để chặn mâu thuẫn ngữ nghĩa (description ghi "mỗi ngày" nhưng type là ONCE → từ chối). Cron 6 trường Spring chuẩn qua cron-utils.
    REQUEUE_ON_FAILURE per-batch (migration V20260819) — quyết định đúng đắn, mặc định tắt cho job cũ.

2.4. Bảo mật cho AI agent là điểm sáng nhất của codebase
Nhiều lớp gate độc lập, thiết kế có tư duy threat-model thật:

    DevHubDatabasePolicy: chỉ SELECT/WITH/SHOW/DESCRIBE/EXPLAIN, allowlist bảng, chặn SLEEP()/BENCHMARK()/LOAD_FILE()/GET_LOCK(), tự gắn LIMIT 200.
    LocalCodingTools: sandbox path (safePath chặn traversal + chặn .git), chặn nội dung file trông như secret, allowlist command, cấm git push/commit từ tool.
    Coding gate ở loadContext: phải có CODING_ALLOWED, EVIDENCE_SUFFICIENT, IDENTITY_VALID, REQUEST_SCOPE=SELECTED_TICKET — và mode INVESTIGATION bắt buộc marker PATCH_AUTHORIZED + evidence line numbers trước khi được sửa file.
    Runtime check STAG_BATCH ngay dòng đầu (ZZA0_1401_coding_batch.java:47) — agent cấm vận hành ngoài staging.
    Gitea token mã hóa AES-256-GCM trong DB, master key qua env (GiteaCredentialResolver); askpass xóa trong finally.
    Agent không được merge PR, không được đóng ticket — mọi điểm terminal đều là con người quyết định.

2.5. Observability tốt bất thường
OpenTelemetry span/meter/counter trong Task.run(), MDC log theo batch code, execution log đầy đủ vào DB (duration, worker, started/finished), AI agent còn log cả token usage per mode (SINGLE_SHOT vs AGENTIC).pom giữ đúng "API only, agent jar mới supply SDK" — tách biệt runtime đẹp.

2.6. Vận hành có nghĩ suy
Rotation API key Ollama tự động (429/401/403/5xx → markFailure, chuyển key theo priority), dry-run cho triage/cleanup, migration idempotent bằng information_schema check, config precedence ENV > file > default, Config.printSummary cố tình không in secret.
3. Điểm yếu
3.1. Bug thật sự (nên fix trước khi làm UI)

Y1 — BATCH_CLEANUP_ON_STARTUP chết config, CLI có thể giết task thật. Config.isCleanupOnStartup() (Config.java:65) chỉ được dùng trong printSummary, không ai đọc nó. Mà initFromDatabase() (Scheduled.java:61-65) luôn đánh RUNNING → TIMEOUT cho mọi task. Hậu quả: mỗi lần gõ CLI java -jar ... run 5 / pause 3 (Cli.java:186-227 đều gọi SchedulerBootstrap.start() đầy đủ) → worker CLI khởi động, quét toàn DB và đánh TIMEOUT tất cả task mà daemon khác đang chạy thật. Đây là bug nghiêm trọng nhất mình tìm thấy.

Y2 — Cột TIMEZONE lưu cho có. SYS_SCHEDULED_TASKS.TIMEZONE default Asia/Ho_Chi_Minh, nhưng CronCalculator.nextExecution() (CronCalculator.java:35) dùng ZoneId.systemDefault(). Deploy worker trên host UTC → job "01:30 hằng ngày" chạy sai giờ 7 tiếng, mà UI vẫn hiện timezone VN. Toàn bộ code dùng LocalDateTime.now() thay ZonedDateTime — phụ thuộc ngầm host TZ.

Y3 — MISFIRE_POLICY cũng lưu cho có. Schema có FIRE_ONCE/SKIP/RESCHEDULE_NEXT nhưng calculateDelay() chỉ Math.max(0, ...) — nextRunAt quá khứ → chạy bù ngay lập tức, bất kể policy. Worker chết 3 giờ, job 5 phút sẽ fire bù 1 lần dù chọn SKIP hay RESCHEDULE.

Y4 — stop/pause không dừng được thread đang chạy. cancel(false) (Scheduled.java:128) cố ý để task chạy nốt, nhưng không có cơ chế cooperative cancel trong Runner — batch dài (clone repo 10 phút, mvn 600s) không thể hủy sạch, status DB ghi STOPPED trong khi process vẫn chạy.

Y5 — Race active-active giữa các worker. Mọi worker đều reconcile trên findAll() mỗi 5s, nên worker B cũng schedule future cho task "thuộc" worker A. Đúng về correctness (claim chặn double-run) nhưng: mỗi cron tick có N lần claim attempt, log nhiễu, và scheduleTask liên tục ghi đè NEXT_RUN_AT theo clock từng worker → drift > 5s giữa hai worker sẽ khiến chúng tự đánh thức lịch của nhau liên tục (điều kiện Duration.between(requested, owned).abs() > 5000 ở Scheduled.java:114). Thiếu leader election (vd GET_LOCK MySQL) hoặc cột OWNED_BY_WORKER.

Y6 — CLI run chỉ đợi 1s rồi shutdown (Cli.java:194) — task dài hơn 1s thì execution log chưa kịp ghi, command báo thành công khi kết quả chưa có.
3.2. Anti-pattern trong code

Reflection hack lấy DataSource. JdbcTaskRepository.class.getDeclaredField("dataSource"); f.setAccessible(true) lặp lại ở ZZA0_1401_batch.java:171, ZZA0_1401_coding_batch.java:574... — bẻ khóa private field của chính project mình. Chỉ cần DataSource getDataSource() default method trên interface TaskRepository là hết.

God class. ZZA0_1401_coding_batch.java 584 dòng gộp chung: git orchestration, Gitea HTTP client, prompt builder, patch parser, verification, issue lifecycle, shell escaping, JSON parser bằng regex. Nhiều dòng >400 ký tự (localCommand viết 1 dòng). Kèm code trùng: loadGiteaDbToken() decrypt AES-GCM inline — y hệt GiteaCredentialResolver.resolveToken() đã có sẵn. Nên tách GitWorkspaceService / GiteaApiClient / PromptBuilder / PatchParser / VerificationService.

Logging ba loại trộn nhau. java.util.logging trong Task/Config, SLF4J trong pom, còn System.out.print / e.printStackTrace() trực tiếp trong Runner và các batch. Muốn đẩy SigNoz (comment trong Config.java:99 đã nhắc) thì phải thống nhất về SLF4J trước.

Parser JSON bằng regex. field()/numberField()/json() tự chế — Jackson đã có sẵn trong classpath (DevHubOllamaCloudModel đang dùng), nên bỏ regex parse cho response Gitea.

DevHubStaticPreflight hardcode một business patch (SAA1_0100, một dòng if cụ thể) ngay trong core batch — đây là rule nghiệp vụ nằm trong source code chung. Nên chuyển thành rule config/file ngoài để không phải rebuild jar mỗi lần thêm rule.
3.3. Bảo mật — còn vài hở

    ZZ_OLLAMA_API_KEY.API_KEY lưu plaintext trong DB (DevHubOllamaCloudModel.loadKeys()), trong khi Gitea token thì mã hóa AES-GCM. Không nhất quán — dùng lại đúng cơ chế mã hóa đó.
    config.properties committed chứa db.username=admin + host staging thật (stag.mysql.devhub.io.vn). Chuyển hết thành placeholder.
    Worker identity bị dump ra môi trường bất kể mode: Config.getWorkerInfo() → detectPublicIp() gọi api.ipify.org / ifconfig.me mỗi lần khởi tạo — kể cả khi chỉ gõ list hay logs. JustFYI: vừa chậm, vừa lộ hạ tầng ra service bên ngoài, vừa fail chậm khi offline. Chỉ nên detect trong daemon mode.
    "Verification" thực chất chỉ compile: runLocalVerification chạy mvn -DskipTests package (ZZA0_1401_coding_batch) — không test nào chạy thật, nhưng logstep ghi "Verification pass" và marker TEST_RESULT. Dễ tạo cảm giác giả an toàn cho người review PR. Nên tách chế độ COMPILE_ONLY vs TEST_REQUIRED theo ticket.
    Fallback username hardcode api_demo_2026 trong askpass (dòng 134) — credential demo nằm trong source.

3.4. Test & delivery

    4 file test, chỉ phủ ZZA0_1900 (viết tốt — verify rollback + không leak DB message) và DataSourceFactory. Phần rủi ro nhất lại không có test: claimTask, reconcileDatabaseControls, CronCalculator, ScheduleValidator. Claim logic đặc biệt cần testcontainers/H2 vì là chỗ dễ race nhất.
    Không có Dockerfile / systemd unit / healthcheck trong zip (docs mô tả deploy 2 VM bằng tay). Daemon không mở port nào để health probe.
    Migration V20260816 lặp y hệt các ALTER đã có trong V20260815 (idempotent nên vô hại, nhưng rối).
    Dependency io.agentscope:harness:2.0.1 — cần chắc chắn repo nội bộ/quyền download có sẵn, nếu không build sẽ fail ở môi trường mới.

4. Ý tưởng nâng cấp giao diện (trọng tâm "người dùng muốn có UI")

Tin tốt: bạn đã có nền móng. SQL seed đã đăng ký ZZA01300 'Batch Scheduler' → /ZZ/A0/ZZA0_1300/ trong SYS_FUNCTION, và doc zz-a0-zza0-1300-sse-check.md xác nhận web project đã có kanban board + SSE realtime (/api/ZZ/A0/ZZA0_1300/stream, event tasks + ping, render lại không reload). Vậy hướng nâng cấp nên là mở rộng ZZA0_1300 thành Batch Control Center, không xây UI riêng lẻ ngoài RBAC.
Phase 1 — Hoàn thiện bảng điều khiển hiện có (nhanh nhất, tác động lớn nhất)
Màn hình
	
