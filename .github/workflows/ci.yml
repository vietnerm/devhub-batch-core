name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend tests (Temurin 25.0.5.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CVE-2026-114938 ("Java4Shell", fixed 2026-11-17) policy: build only with a
      # patched Temurin JDK. 25.0.5.1 contains the HotSpot fix. Do NOT downgrade.
      - name: Set up Eclipse Temurin 25 (patched CVE-2026-114938)
        uses: actions/setup-java@v6   # ✅ Cập nhật lên v6
        with:
          distribution: 'temurin'
          java-version: '25.0.5.1+2'  # ✅ Đúng định dạng của Adoptium
          cache: maven

      - name: Security gate — no Base64 decoder in source
        run: sh ./scripts/check-no-base64.sh

      # Unit tests (H2) + MySQL integration tests (Testcontainers, docker is
      # available on ubuntu-latest runners) + shaded jar packaging.
      - name: Build, unit tests and MySQL integration tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            '**/target/surefire-reports/'
            '**/target/failsafe-reports/'
          if-no-files-found: ignore

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: devhub-batch-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: devhub-batch-web

      - name: Lint, type-check and build
        run: |
          npm run lint
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          npm run build
        working-directory: devhub-batch-web

  docker:
    name: Docker image build (no push)
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.5.1+2'
          cache: maven

      - name: Package API
        run: mvn -B -ntp -DskipTests package

      - name: Build API image
        run: docker build -t devhub-batch-api:ci -f devhub-batch-api/Dockerfile devhub-batch-api

      - name: Build web image
        run: docker build -t devhub-batch-web:ci devhub-batch-web
