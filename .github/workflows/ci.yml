Phase 2 — Schedule Designer (phần "dành cho người dùng không biết cron")

Đây là nâng cấp UX đáng tiền nhất, tận dụng chính ScheduleValidator + CronCalculator phía web (2 class này pure Java, copy sang web project hoặc expose qua API của batch):

    Form tạo/sửa task: 2 tab Chạy một lần (datetime picker) / Định kỳ (cron).
    Cron builder: chọn "Mỗi ngày 01:30" / "Mỗi 5 phút" / "Thứ Hai–Sáu 06:00" → sinh cron 6 trường, người dùng không cần biết cú pháp.
    Preview "5 lần chạy kế tiếp" — gọi API validate trả về danh sách thời điểm cụ thể. Thao tác này chặn luôn lớp lỗi Y1/Y2 ở UI trước khi code fix xong.
    Cảnh báo realtime nếu description mâu thuẫn type (chính rule hasRecurringDescription hiện có).
    Cấu hình nâng cao gom gọn: start/end window, timezone (dropdown, sau khi fix Y2), misfire policy, requeue-on-failure, priority.

Phase 3 — Realtime & hành động an toàn

    SSE đã có → mở rộng event: task_status_changed, log_appended (tail execution log live kiểu terminal), worker_offline alert.
    Mọi action (pause/run/delete) phải: check FUN_PERMISS theo role (chỉ IT admin), ghi audit (bắt chước SYS_IT_TICKET_ACTION_AUDIT đã có ở coding batch), và confirm mạnh với delete/stop.
    Nút "Xác nhận đã xem lỗi" cho task ERROR thay vì cho phép xoá log trực tiếp.

Phase 4 — AI Ticket Ops view (khác biệt hóa sản phẩm)

Vì đây là điểm độc đáo của dự án: một màn hình riêng theo dõi pipeline AI coding — kanban QUEUED → CLAIMED → PATCHING → VERIFYING → AWAITING_REVIEW, click card xem diff, agent response markers (PATCH_AUTHORIZED, ROOT_CAUSE_CONFIDENCE), token usage và chi phí, approval/reject cho người IT. Phần lớn data đã nằm trong SYS_IT_TICKET_CODING_EXECUTIONS + bảng log phase.
5. Ý tưởng nâng cấp ngoài UI (theo thứ tự nên làm)

    Fix Y1-Y3 (cleanup flag, timezone thật, misfire policy) — nhỏ nhưng phải làm trước khi có UI, vì UI hiện NEXT_RUN sai thì mất niềm tin ngay.
    Leader election: dùng SELECT GET_LOCK('devhub-scheduler-leader', 0) — chỉ leader schedule, worker còn lại chỉ heartbeat. Giải quyết Y5 với ~20 dòng code.
    Hợp lệ hóa BEAN_CLASS khi save: Class.forName check + kiểm tra instanceof Runner lúc insert, không đợi lúc chạy mới fail.
    Bỏ reflection hack: thêm getDataSource() vào TaskRepository.
    Mã hóa Ollama key + dọn config.properties + chỉ detect public IP trong daemon mode.
    Tách god class + thống nhất SLF4J + Jackson thay regex JSON.
    Test cho core: unit test ScheduleValidator/CronCalculator, integration test claimTask + reconcile (Testcontainers MySQL), bắt buộc trước khi refactor.
    Delivery: Dockerfile + compose (batch + MySQL), healthcheck bằng file mtime heartbeat hoặc mở 1 port HTTP nhỏ, thêm retention job cho SYS_TASK_EXECUTION_LOGS (bạn đã có pattern ở ZZA0_1800).

6. Thảo luận — tiếp tục coding từ đâu?

Mình đề xuất 2 hướng và bạn chọn:

Hướng A — "Sạch nhà trước": Sprint fix Y1-Y4 + leader election + test core (ước 1-2 session code). Sau đó làm UI sẽ chắc chắn, vì mọi con số dashboard hiển thị đều đúng.

Hướng B — "UI trước, sửa sau": bật tay ngay Phase 1 (Dashboard + danh sách task + chi tiết log + workers) trên devhub-rbac-web, vì schema và reconcile loop đã đủ để đọc đúng; các bug Y1-Y3 chỉ ảnh hưởng vài khung giờ đặc biệt (host UTC, worker chết), chưa chặn UI demo được.

Cá nhân mình nghiêng về A nhắm phục vụ B: Y1 (CLI giết task của daemon) và Y2 (timezone) là hai lỗi sẽ đốt thời gian debug khi nhiều người cùng dùng giao diện — sửa trước khoảng nửa ngày là xong.

