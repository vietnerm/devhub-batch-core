# ============================================================
# DevHub Batch Core — sample configuration
# Priority: ENV var > -Dconfig.file properties > classpath config.properties > default
# ${VAR} placeholders are interpolated from the process environment.
# ============================================================

db.url=${BATCH_DB_URL}
db.username=${BATCH_DB_USERNAME}
db.password=${BATCH_DB_PASSWORD}
db.pool.size=5

# Scheduler tuning
batch.thread-pool-size=5
batch.poll-interval-ms=1000
batch.heartbeat-interval-ms=5000
batch.reconcile-interval-ms=5000
batch.stale-worker-threshold-ms=30000
batch.misfire-grace-ms=30000
batch.log-retention-days=30
batch.cleanup-on-startup=true
batch.migrate-on-startup=true
batch.leader-lock-name=devhub-batch-core-leader

# Encrypted values use enc:<hex> and are decrypted with BATCH_MASTER_KEY
# (64 hex characters = 32 bytes, AES-256-GCM). Create one:
#   echo -n 'secret' | java -jar devhub-batch-core.jar encrypt

# Worker identity (optional overrides; hostname/private IP/MAC are auto-detected)
worker.id=
worker.owner-id=unknown
worker.owner-name=unknown
worker.owner-email=unknown
worker.machine-name=
worker.private-ip=
worker.public-ip=
worker.environment=default
worker.location=unknown
worker.container-id=unknown
worker.app-version=devhub-batch-core
